<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><title>物理器械室 · __EXPERIMENT_NAME__</title>
<meta name="description" content="拆解实验装置，观察运动、仪表与物理规律怎样联系。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='none' stroke='%23356fdc' stroke-width='2' d='M10 4h12v12a8 8 0 1 1-12 0Z M10 12h12 M13 23h6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./machine-nav.css"><link rel="stylesheet" href="./speed-control.css"><link rel="stylesheet" href="./whiteboard.css"><link rel="stylesheet" href="./experiment.css">
</head><body class="experiment-lab" data-experiment="__EXPERIMENT_KIND__">
<a class="skip" href="#experiment">跳到交互演示</a><main class="lab-shell">
<header class="masthead"><div class="brand"><h1><a class="room-home" href="./index.html" aria-label="返回物理器械室首页"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m12 5-5 5 5 5"/></svg>物理器械室</a></h1><span class="room-section">热能实验室</span></div>__MACHINE_NAV__</header>
<section class="experiment" id="experiment" aria-label="__EXPERIMENT_NAME__交互演示"><div class="workbench">
<section class="figure-panel" aria-label="模型展示区"><div class="visual-stage">
<div id="model-surface"><div id="stage-3d"><iframe id="machine" title="__EXPERIMENT_NAME__交互立体模型"></iframe><div id="loading" class="loading"><span class="loading-ring"></span><p>正在准备实验装置…</p></div></div><div id="stage-paper" hidden></div></div>
<div class="scene-top"><h2 id="stage-badge">__EXPERIMENT_NAME__</h2><span id="stage-status">认识构造</span><button id="lesson-toggle" class="outline-button" aria-expanded="false" aria-controls="lesson-panel">构造与实验<svg class="lesson-chevron" viewBox="0 0 20 20" aria-hidden="true"><path d="m5 7 5 5 5-5"/></svg></button></div>
<div class="experiment-hud" id="experiment-hud" hidden><div id="readouts" class="experiment-readouts"></div><div id="operation-switch" class="experiment-operations" role="group" aria-label="选择气体变化过程" hidden></div><button id="plot-toggle" aria-expanded="false" aria-controls="plot-panel" hidden>p–V 图像 <span aria-hidden="true">↗</span></button><button id="mechanism-focus" hidden>近看搅拌机构 <span aria-hidden="true">↗</span></button></div>
<div id="plot-panel" class="plot-panel" hidden><div class="plot-heading"><strong>状态轨迹</strong><button id="plot-close" aria-label="关闭图像">×</button></div><svg id="experiment-plot" viewBox="0 0 280 185" role="img" aria-label="气体压强与体积关系图"></svg><p id="plot-equation"></p></div>
<div class="scene-bottom"><div class="playback-controls"><button id="play" class="play" aria-pressed="false"><span id="play-icon" aria-hidden="true"><svg class="icon-play" viewBox="0 0 16 16"><path d="M5 3.5 12 8 5 12.5Z"/></svg><svg class="icon-pause" viewBox="0 0 16 16"><rect x="4" y="3" width="3" height="10" rx=".7"/><rect x="9" y="3" width="3" height="10" rx=".7"/></svg></span><span id="play-text">开始实验</span></button><label class="playback-speed"><span>倍速</span><select id="speed" aria-label="教学动画速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></label></div>
<div class="stage-tools"><div class="mode-bar" role="group" aria-label="模型显示方式"><button data-mode="assembled" aria-pressed="false">整体</button><button data-mode="cut" aria-pressed="true">剖切</button><button data-mode="explode" aria-pressed="false">拆解</button><button data-mode="xray" aria-pressed="false">透视</button><div class="camera-tools" aria-label="调整视角"><button data-camera="zoom-in" aria-label="放大"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button><button data-camera="zoom-out" aria-label="缩小"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button><button data-camera="reset" aria-label="视角复位"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10a8 8 0 1 1-3-5M17 2v5h5M12 8v5l3 2"/></svg></button></div></div><button id="whiteboard-open" class="whiteboard-open" aria-label="进入课堂白板"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 15 10-10 4 4L9 19l-5 1 1-5Zm8-8 4 4M4 23h17"/></svg></button></div></div>
</div></section>
<aside class="lesson-panel" id="lesson-panel" aria-labelledby="lesson-heading" hidden inert><div class="panel-heading"><h2 id="lesson-heading">构造与实验</h2><button id="lesson-close" aria-label="关闭教学卡片">×</button></div><div class="lesson-tabs" role="tablist" aria-label="教学内容"><button id="tab-structure" role="tab" aria-selected="true" aria-controls="lesson-structure" data-section="structure">认识构造</button><button id="tab-experiment" role="tab" aria-selected="false" aria-controls="lesson-experiment" data-section="experiment" tabindex="-1">观察实验</button></div>
<div class="lesson-scroll"><section id="lesson-structure" role="tabpanel" aria-labelledby="tab-structure"><div class="view-tabs" role="group" aria-label="选择观察视图"><button data-view="3d" aria-pressed="true">立体模型</button><button data-view="paper" aria-pressed="false">纸上结构</button></div><div class="section-caption"><h3>认识部件</h3><span>点击定位</span></div><div id="parts" class="parts"></div><div class="part-detail"><p id="part-code"></p><h3 id="part-hint"></h3><p id="part-text"></p><p id="part-link" class="connection"></p><button id="part-focus" class="assembly-start">近看这个部件 ↗</button></div></section>
<section id="lesson-experiment" role="tabpanel" aria-labelledby="tab-experiment" hidden><div id="experiment-inputs"></div><div class="phase-copy"><h3 id="phase-title"></h3><p id="phase-text"></p></div><div class="energy-note"><span class="energy-label">实验中的关系</span><h3 id="experiment-equation"></h3><p id="experiment-relation"></p></div><div id="energy-readouts" class="live-state"></div><div class="transport"><button id="reset">↻ 重新实验</button></div></section>
<details id="notes"><summary>教材对应与模型说明</summary><div id="model-notes" class="notes-body"></div></details><button id="assembly-start" class="assembly-start">重播组装入场</button></div></aside>
</div></section>
<section class="teaching-footer" aria-label="实验播放与进度"><div class="current-caption"><h2 id="caption-title">认识实验装置</h2><p id="caption-text"></p></div><section id="cycle-overview" class="cycle-overview" hidden><div class="experiment-scrubber"><label for="progress" class="sr-only">实验进度</label><input id="progress" type="range" min="0" max="1000" step="1" value="0"><output id="progress-output" for="progress">0%</output></div><ol id="stage-track" class="cycle-phase-track"></ol></section><section id="assembly-controls" class="assembly-controls"><div class="assembly-control-top"><span id="assembly-count"></span><div class="assembly-actions"><button id="assembly-pause">暂停</button><button id="assembly-next">下一步 →</button><button id="assembly-exit">看完整结构</button></div></div><div id="assembly-steps" class="assembly-steps"></div></section></section>
</main><div id="interaction-status" class="sr-only" role="status" aria-live="polite"></div><script type="module" src="./experiment-app.mjs"></script></body></html>
