<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>制冷机械 · 交互结构</title>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#fff}
    html body{--paper:#fff;--ink:#1c2e3f;--mute:#65778d}
    body .lab-ui{font-family:"Microsoft YaHei","PingFang SC",sans-serif;pointer-events:none}
    body .lab-prompt,body .lab-pills,body .lab-side,body .lab-scale,body .lab-modes,
    body .lab-how,body .lab-beat,body .lab-flash,body .lab-cursor{display:none!important}
    body #lab-gl{width:100%;height:100%;outline:none;touch-action:none}
    body .lab-lab{padding:8px 11px;border:1px solid #adc7f4;background:#fff;border-radius:6px;color:#1c2e3f;font-size:12px;font-weight:600;line-height:1.5;letter-spacing:.025em;text-shadow:none;transition:none}
    body .lab-lab small{display:none}
    body .lab-labels svg path{stroke:#8aaff0}
    body .lab-labels svg circle{fill:#356fdc;stroke:#fff;stroke-width:2}
    #scene-error{display:none;position:absolute;inset:30% 10%;font:14px/1.8 "Microsoft YaHei",sans-serif;color:#65778d;text-align:center}
    @media(max-width:600px){body .lab-lab{font-size:11px;padding:6px 8px}}
  </style>
  <script type="importmap">
  {"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}
  </script>
</head>
<body data-machine="__COOLING_MACHINE__">
  <div id="scene-error" role="status"></div>
  <script>
    addEventListener('error',event=>{
      const el=document.getElementById('scene-error');el.style.display='block';el.textContent='三维模型暂时未能载入，请刷新页面。';
      if(parent!==window){let origin=location.origin;try{origin=parent.location.origin;}catch{}parent.postMessage({type:'cooling-error',message:event.message||'模型加载失败'},/^https?:\/\//.test(origin)?origin:'*');}
    });
  </script>
  <script type="module" src="./refrigeration-scene.mjs"></script>
</body>
</html>
