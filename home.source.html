<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="选择一件器材，拆开它的结构，观察物理如何发生。">
  <title>物理器械室</title>
  <script>
    try {
      if (!sessionStorage.getItem('physics-room-arrival-v1') && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.documentElement.classList.add('room-arriving');
        setTimeout(() => document.documentElement.classList.remove('room-arriving'), 2400);
      }
    } catch {}
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg fill='none' stroke='%23356fdc' stroke-width='1.8' stroke-linejoin='round'%3E%3Cpath d='m16 3 12 7v13l-12 7-12-7V10Zm0 14v13M4 10l12 7 12-7'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="./home.css">
</head>
<body>
  <main class="apparatus-room">
    <header class="room-heading">
      <h1 class="room-title">物理器械室</h1>
      <p class="room-subtitle">拆开结构，观察物理如何发生。</p>
    </header>
    <nav class="apparatus-arc" aria-label="选择物理器材">
      <a class="apparatus apparatus-fridge" href="./refrigerator.html" aria-labelledby="name-fridge" aria-describedby="description-fridge" data-device="fridge">
        <span class="apparatus-display">
        <span class="apparatus-preview"><img src="./assets/home/fridge.png" width="700" height="840" alt="" decoding="async" draggable="false"></span>
        <span class="apparatus-name" id="name-fridge">电冰箱<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h12m-5-5 5 5-5 5"/></svg></span>
        <span class="apparatus-description" id="description-fridge">把箱内的热量搬到箱外</span>
        </span>
      </a>
      <a class="apparatus apparatus-engine is-current" href="./engine.html" aria-labelledby="name-engine" aria-describedby="description-engine" data-device="engine">
        <span class="apparatus-display">
        <span class="apparatus-preview"><img src="./assets/home/engine.png" width="700" height="840" alt="" decoding="async" draggable="false"></span>
        <span class="apparatus-name" id="name-engine">汽油机<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h12m-5-5 5 5-5 5"/></svg></span>
        <span class="apparatus-description" id="description-engine">内能转化为机械能</span>
        </span>
      </a>
      <a class="apparatus apparatus-ac" href="./air-conditioner.html" aria-labelledby="name-ac" aria-describedby="description-ac" data-device="ac">
        <span class="apparatus-display">
        <span class="apparatus-preview"><img src="./assets/home/ac.png" width="700" height="840" alt="" decoding="async" draggable="false"></span>
        <span class="apparatus-name" id="name-ac">空调<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h12m-5-5 5 5-5 5"/></svg></span>
        <span class="apparatus-description" id="description-ac">让热量在室内外转移</span>
        </span>
      </a>
    </nav>
  </main>
  <script type="module" src="./home.mjs"></script>
</body>
</html>
