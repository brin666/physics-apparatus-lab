<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>__APPARATUS_NAME__ · 物理器械室</title><link rel="icon" href="data:,"><link rel="stylesheet" href="./apparatus.css"><link rel="stylesheet" href="./whiteboard.css"></head>
<body data-apparatus="__APPARATUS_ID__"><main class="device-shell">
 <header class="device-header"><a class="room-link" href="./index.html">〈 <strong>物理器械室</strong></a><span id="category-name"></span><nav aria-label="选择器材"><label for="device-switch" class="sr-only">选择器材</label><select id="device-switch"></select></nav></header>
 <section class="device-stage" aria-label="互动三维教具">
  <div id="model-surface"><div id="device-canvas"></div><div id="load-error" role="alert" hidden>模型暂时未能载入，请刷新页面重试。</div></div>
  <div class="stage-heading"><div><h1>__APPARATUS_NAME__</h1><p id="stage-subtitle"></p></div><div class="heading-actions"><button id="variables-toggle" aria-expanded="false" aria-controls="variables-panel">实验调节 <span>⌄</span></button><button id="lesson-toggle" aria-expanded="false" aria-controls="lesson-panel">构造与原理 <span>⌄</span></button></div></div>
  <div id="section-legend" hidden aria-label="电流与受力符号图例"><span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle class="legend-dot" cx="12" cy="12" r="3"/></svg>流出屏幕</span><span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 8 8 8m0-8-8 8"/></svg>流入屏幕</span><span class="legend-force"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h17m-6-6 6 6-6 6"/></svg>受力</span></div>
  <aside id="variables-panel" class="float-panel variables-panel" hidden><div class="panel-heading"><h2>调节与观察</h2><button id="variables-close" aria-label="关闭实验调节">×</button></div><div id="device-controls"></div><div id="readouts" aria-live="off"></div><p class="variable-hint">拖动滑块，观察模型的变化。</p></aside>
  <aside id="lesson-panel" class="float-panel lesson-panel" hidden><div class="panel-heading"><h2>构造与原理</h2><button id="lesson-close" aria-label="关闭构造与原理">×</button></div><div class="lesson-scroll"><h3>认识部件</h3><div id="part-list"></div><h3>怎样工作</h3><p id="principle"></p><details><summary>模型说明与原理资料</summary><p id="model-notes"></p><ul id="source-list"></ul></details><button id="replay" class="replay">重播组装入场</button></div></aside>
  <div id="part-tools" hidden><span>按住零件拖动</span><button data-tool="rotate" aria-pressed="true">旋转</button><button data-tool="move" aria-pressed="false">移动</button><button id="part-reset">零件归位</button></div>
  <aside id="part-inspector" hidden><button id="inspector-close" aria-label="关闭零件说明">×</button><h2 id="part-name"></h2><p id="part-function"></p></aside>
  <div class="device-dock"><button id="play" class="primary"><svg class="play-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 4 16 10 6 16Z"/></svg><svg class="pause-icon" viewBox="0 0 20 20" aria-hidden="true"><rect x="5" y="4" width="3" height="12" rx="1"/><rect x="12" y="4" width="3" height="12" rx="1"/></svg><span id="play-text">开始演示</span></button><label class="speed-label">倍速 <select id="speed" aria-label="播放倍速"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label><div class="mode-group" role="group" aria-label="模型显示方式"><button data-mode="assembled" aria-pressed="true">整体</button><button data-mode="cut" aria-pressed="false">剖切</button><button data-mode="explode" aria-pressed="false">拆解</button><button data-mode="xray" aria-pressed="false">透视</button></div><div class="camera-group"><button data-view="zoom-in" aria-label="放大">＋</button><button data-view="zoom-out" aria-label="缩小">−</button><button data-view="reset" aria-label="恢复视角">↺</button></div><button id="whiteboard-open" aria-label="打开课堂白板" title="课堂白板"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 15 10-10 4 4L9 19l-5 1 1-5ZM13 7l4 4M4 23h17"/></svg></button></div>
 </section>
 <footer class="teaching-footer"><div class="current-caption"><h2 id="caption-title"></h2><p id="caption-text"></p></div><div class="teaching-progress"><div class="progress-heading"><span id="progress-label"></span><button id="skip-intro" hidden>看完整结构 →</button></div><div id="phase-track"></div></div></footer>
</main><script type="module" src="./apparatus/app.mjs"></script></body></html>
